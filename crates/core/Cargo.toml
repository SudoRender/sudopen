[package]
name = "sudopen-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
memchr = "2.8"
memmap2 = "0.9"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig", "dump-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2"
