[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/finder"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
sudopen-core = { path = "crates/core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# syntect/oniguruma are unusably slow unoptimized; keep dev builds snappy.
[profile.dev.package."*"]
opt-level = 2
