# Builds the universal app, signs it with the SudoRender Developer ID,
# notarizes and staples the DMG, and attaches it to the GitHub release.
#
# - Push a tag vX.Y.Z (matching the version in Cargo.toml) to release it.
# - Or run it by hand for an existing release: it builds the selected branch
#   and replaces that release's DMG.
#
# Secrets come from the SudoRender organization.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to attach the DMG to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7

      - name: Check version matches tag
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$v" != "$TAG" ]; then
            echo "::error::Cargo.toml version $v does not match $TAG"
            exit 1
          fi

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Test
        run: cargo test --workspace --release

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning build.keychain

      - name: Build, sign and notarize the DMG
        env:
          UNIVERSAL: "1"
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          scripts/dmg.sh
          dmg="target/dist/sudopen-${TAG#v}.dmg"
          xcrun stapler validate "$dmg"
          lipo -archs target/release/sudopen.app/Contents/MacOS/sudopen

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="target/dist/sudopen-${TAG#v}.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" --clobber
          else
            gh release create "$TAG" "$dmg" --title "sudopen ${TAG#v}" --generate-notes
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: sudopen-dmg
          path: target/dist/*.dmg
